version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres_vector
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: cs_support_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d cs_support_rag"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    env_file:
      - .env
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
      - ./scripts/init-ollama.sh:/init-ollama.sh
    entrypoint: ["/bin/sh", "/init-ollama.sh"]

  app:
    build: .
    container_name: streamlit_rag
    env_file:
      - .env
    ports:
      - "8501:8501"
    environment:
      - DB_URL=postgresql+psycopg://rag_user:rag_password@postgres:5432/cs_support_rag
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./app:/app/app

volumes:
  pgdata:
  ollama_storage: