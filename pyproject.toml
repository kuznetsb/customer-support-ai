version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kuznetsb", email = "kuznetsbog@gmail.com" }
]
requires-python = ">=3.14,<4.0.0"
dependencies = [
    "langchain-ollama>=1.1.0",
